undocumentedEndpoints:
- url: https://www.nerc.com/api/search
  method: GET
  parameters: q (query string)
  auth: none
  documented: false
  note: Optimizely CMS site search. Returns filters[], hasMorePages, totalMatching,
    totalPages, items[] with documentResult/pageResult objects.
- url: https://www.nerc.com/api/search/events
  method: GET
  auth: none
  documented: false
  note: Returns year, month, monthAndYearDisplay, programsAndDepartments[] filters
    and event items.
- url: https://www.nerc.com/api/search/news
  method: GET
  auth: none
  documented: false
  note: Returns dated newsroom items with category and allNewsTypes.
- url: https://www.nerc.com/api/search/terms
  method: GET
  parameters: q
  auth: none
  documented: false
  note: Returns statusFilters such as "Filed and Pending Regulatory Approval", "Subject
    to Enforcement", "Subject to Future Enforcement".
- disposition: 'Discovered by reading the site''s own JavaScript bundle. Real,

    anonymous and repeatable, but undocumented, unpublished, unsupported and

    covered by no terms of programmatic use. Deliberately NOT listed in apis.yml

    apis[] — listing an internal CMS XHR route as a public API would

    misrepresent NERC''s posture.

    '
artifacts: []
notFound:
- Developer portal of any kind
- API documentation or reference
- OpenAPI, Swagger, AsyncAPI, GraphQL schema or Postman collection
- SDKs or client libraries
- Green Button / ESPI endpoint or reference
- Consumer or customer usage/billing API
- Open data portal, dataset API or bulk data service
- Machine-readable representation of any Reliability Standard
- RSS or Atom feed
- data.json, apis.json, .well-known/api-catalog, llms.txt, security.txt
- OpenID Connect discovery document
- MCP server
- Public API status page
- Webhooks or event/notification API
- Public GitHub organization with code attributable to this NERC
- Any public API for GADS, TADS, DADS, MIDAS, Align, SEL, CORES or E-ISAC
