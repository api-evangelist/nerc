note: >-
  NERC's own corporate host (www.nerc.com) serves no /.well-known document of any
  kind - security.txt, openid-configuration, oauth-authorization-server,
  oauth-protected-resource, api-catalog and ai-plugin.json all return HTTP 404.
  The one real, anonymous, machine-readable discovery document anywhere in NERC's
  surface belongs to the Electricity Information Sharing and Analysis Center
  (E-ISAC), which NERC operates on Salesforce Experience Cloud: www.eisac.com
  serves a valid OpenID Connect Discovery 1.0 document at
  /.well-known/openid-configuration. It is the Salesforce platform's standard
  issuer metadata rather than a NERC-authored developer contract, and every
  resource it protects (/services/data/v62.0 returns HTTP 401
  INVALID_SESSION_ID) is membership-gated - but the discovery document itself is
  real, anonymous and captured verbatim here.
  eroportal.nerc.net and www.nercalerts.com answer HTTP 200 on every probed path
  because both return a soft-404 HTML error page (Adxstudio "Customer Portal"
  error page and a Certrec-hosted HTML shell respectively); neither serves an
  actual well-known document. Statuses below are the raw HTTP codes with the
  soft-404 noted.
