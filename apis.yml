name: NERC
kind: company
description: 'The North American Electric Reliability Corporation (NERC) is the not-for-profit
  international regulatory authority certified by FERC in July 2006 as the Electric Reliability
  Organization under Section 215 of the Federal Power Act, added by the Energy Policy Act
  of 2005. From offices in Washington, DC and Atlanta, and working through six Regional Entities
  (MRO, NPCC, RF, SERC, Texas RE, WECC), NERC develops and enforces the mandatory Reliability
  Standards, including the CIP cyber security standards, that govern the bulk power system
  across the contiguous United States, all of Canada, and a portion of Baja California, Mexico.
  It registers and certifies the entities that operate that system, monitors and enforces
  compliance, runs the Electricity Information Sharing and Analysis Center (E-ISAC), and collects
  mandatory industry performance data through Rules of Procedure Section 1600 data requests
  into GADS, TADS, DADS and MIDAS. NERC sits at the top of the North American bulk-power value
  chain, above the ISOs/RTOs, transmission owners and generator owners it registers, and entirely
  above the retail utility-to-customer relationship. Its API posture is the plainest in this
  series. NERC publishes NO developer API, NO OpenAPI, NO SDK, NO developer portal and NO
  open data portal. A site search of nerc.com for the term API on 2026-07-27 returned zero
  matching documents. NERC is a MANDATOR of energy data, not a publisher of it. The obligation
  it imposes is to SUBMIT data upward to NERC, and the data submitted is explicitly confidential
  under Rules of Procedure Section 1500. What NERC does publish anonymously is documents:
  reliability assessments, the State of Reliability report, aggregated GADS/TADS statistics,
  Power BI dashboards and the public NERC Compliance Registry Matrix spreadsheet of every
  registered entity. Everything machine-facing, including the ERO Portal, Align, the Secure
  Evidence Locker, CORES, the GADS/TADS data stores and the E-ISAC portal, is behind an approved
  account. No Green Button, no ESPI, no consumer data right, and no consumer usage or billing
  API exists anywhere in NERC''s surface, because retail customer data is outside its reach
  entirely. NERC is a regulator whose peer FERC publishes a documented public API and whose
  neighbour EIA publishes one of the best government APIs anywhere, while NERC itself publishes
  none.'
